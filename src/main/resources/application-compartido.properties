spring.application.name=gajog

# =====================================================================
# A02 Configuraci\u00c3\u00b3n de seguridad (Joaqu\u00c3\u00adn)
# Las credenciales de la base de datos YA NO se escriben aqu\u00c3\u00ad.
# Cada integrante las pone en su archivo local (no se sube a GitHub):
#   src/main/resources/application-local.properties
# o como variables de entorno DB_URL, DB_USERNAME y DB_PASSWORD.
# =====================================================================
spring.config.import=optional:classpath:application-local.properties
spring.datasource.url=jdbc:mysql://gateway01.sa-east-1.prod.aws.tidbcloud.com:4000/taekwondo_db?sslMode=VERIFY_IDENTITY&connectionTimeZone=America/Lima
spring.datasource.username=${TIDB_USER}
spring.datasource.password=${TIDB_PASSWORD}

# Renueva las conexiones antes de que la base en la nube las cierre
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.keepalive-time=60000

gajog.datos-prueba.enabled=true
# Contrase\u00c3\u00b1a de los usuarios de prueba (admin, recepcion, instructor).
# Se puede cambiar con la variable de entorno GAJOG_PASSWORD_INICIAL.
gajog.seguridad.password-inicial=${GAJOG_PASSWORD_INICIAL:Gajog#2026}

# Crea y actualiza las tablas a partir de las clases @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true
spring.jackson.serialization.fail-on-empty-beans=false

# A02: las p\u00c3\u00a1ginas de error no muestran detalles internos al usuario
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false

# A02: cookie de sesi\u00c3\u00b3n protegida y sesi\u00c3\u00b3n que vence por inactividad
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=30m

# A09: los eventos de seguridad se guardan tambi\u00c3\u00a9n en un archivo
logging.file.name=logs/gajog.log
logging.level.SEGURIDAD=INFO
