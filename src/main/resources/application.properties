spring.application.name=gajog

# =====================================================================
# A02 Configuración de seguridad (Joaquín)
# Las credenciales de la base de datos YA NO se escriben aquí.
# Cada integrante las pone en su archivo local (no se sube a GitHub):
#   src/main/resources/application-local.properties
# o como variables de entorno DB_URL, DB_USERNAME y DB_PASSWORD.
# =====================================================================
spring.config.import=optional:classpath:application-local.properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/taekwondo_db?createDatabaseIfNotExist=true&serverTimezone=America/Lima}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Renueva las conexiones antes de que la base en la nube las cierre
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.keepalive-time=60000

gajog.datos-prueba.enabled=true
# Contraseña de los usuarios de prueba (admin, recepcion, instructor).
# Se puede cambiar con la variable de entorno GAJOG_PASSWORD_INICIAL.
gajog.seguridad.password-inicial=${GAJOG_PASSWORD_INICIAL:Gajog#2026}

# Crea y actualiza las tablas a partir de las clases @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true
spring.jackson.serialization.fail-on-empty-beans=false

# A02: las páginas de error no muestran detalles internos al usuario
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false

# A02: cookie de sesión protegida y sesión que vence por inactividad
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=30m

# A09: los eventos de seguridad se guardan también en un archivo
logging.file.name=logs/gajog.log
logging.level.SEGURIDAD=INFO
