spring.application.name=gajog
#spring.datasource.url=jdbc:mysql://localhost:3306/taekwondo_db?createDatabaseIfNotExist=true&serverTimezone=America/Lima
spring.datasource.url=jdbc:mysql://gateway01.sa-east-1.prod.aws.tidbcloud.com:4000/taekwondo_db?sslMode=VERIFY_IDENTITY&connectionTimeZone=America/Lima
spring.datasource.username=${USERNAME}
spring.datasource.password=${PASSWORD}
gajog.datos-prueba.enabled=true

# Crea y actualiza las tablas autom\u00c3\u00a1ticamente a partir de tus clases @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true
spring.jackson.serialization.fail-on-empty-beans=false