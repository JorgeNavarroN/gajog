spring.application.name=gajog
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Codificación UTF-8 forzada
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.messages.encoding=UTF-8

# Zona horaria y JPA (open-in-view DESACTIVADO definitivamente)
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.time-zone=America/Lima

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# Parámetros de negocio configurables
gajog.negocio.dias-aviso-por-vencer=${GAJOG_DIAS_AVISO:5}
gajog.negocio.dias-gracia-mora=${GAJOG_DIAS_GRACIA:15}
gajog.negocio.baja-automatica-mora=${GAJOG_BAJA_AUTO_MORA:false}
gajog.negocio.asistencia-minima-examen=${GAJOG_ASISTENCIA_MIN_EXAMEN:75}
gajog.negocio.meses-minimos-examen=${GAJOG_MESES_MIN_EXAMEN:3}
gajog.negocio.minutos-tolerancia-tardanza=${GAJOG_TOLERANCIA_TARDANZA:10}