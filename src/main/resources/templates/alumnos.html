<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Alumnos - GAJOG TKD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">🥋 GAJOG TKD</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/}">Inicio</a>
            <a class="nav-link active" th:href="@{/alumnos}">Alumnos</a>
            <a class="nav-link" th:href="@{/matriculas}">Matrículas</a>
            <a class="nav-link" th:href="@{/pagos}">Pagos</a>
            <a class="nav-link" th:href="@{/asistencias}">Asistencias</a>
            <a class="nav-link" th:href="@{/examenes}">Exámenes</a>
        </div>
    </div>
</nav>

<div class="container">
    <div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="row g-4">
        <!-- Formulario Nuevo Alumno -->
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white fw-bold">Registrar Nuevo Alumno</div>
                <div class="card-body">
                    <form th:action="@{/alumnos/guardar}" method="post">
                        <div class="mb-2">
                            <label class="form-label">DNI</label>
                            <input type="text" name="dni" class="form-control" maxlength="15" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Nombres</label>
                            <input type="text" name="nombres" class="form-control" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Apellidos</label>
                            <input type="text" name="apellidos" class="form-control" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Fecha de Nacimiento</label>
                            <input type="date" name="fechaNacimiento" class="form-control" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Teléfono</label>
                            <input type="text" name="telefono" class="form-control">
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Correo</label>
                            <input type="email" name="correo" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Cinturón Inicial</label>
                            <select name="cinturonInicialId" class="form-select" required>
                                <option th:each="c : ${cinturones}"
                                        th:value="${c.id}"
                                        th:text="${c.nombre}"></option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Guardar Alumno</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Tabla de Alumnos -->
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-white fw-bold">Listado de Alumnos</div>
                <div class="card-body table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>DNI</th>
                                <th>Alumno</th>
                                <th>Cinturón Actual</th>
                                <th>Ingreso</th>
                                <th>Estado</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="a : ${alumnos}">
                                <td th:text="${a.persona.dni}"></td>
                                <td th:text="${a.persona.nombres + ' ' + a.persona.apellidos}"></td>
                                <td>
                                    <span class="badge bg-secondary"
                                          th:text="${a.cinturonActual != null ? a.cinturonActual.nombre : 'Sin asignar'}"></span>
                                </td>
                                <td th:text="${a.fechaIngreso}"></td>
                                <td>
                                    <span class="badge bg-success" th:text="${a.estado}"></span>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(alumnos)}">
                                <td colspan="5" class="text-center text-muted">No hay alumnos registrados aún.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
