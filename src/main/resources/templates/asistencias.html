<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Control de Asistencias')}"></head>
<body class="bg-light">

<nav th:replace="~{fragments/layout :: navbar('asistencias')}"></nav>

<div class="container">
    <div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="row g-4">
        <!-- Columna Izquierda: Crear Sesión y Listado de Sesiones -->
        <div class="col-md-5">
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-dark text-white fw-bold">1. Programar Sesión de Clase</div>
                <div class="card-body">
                    <form th:action="@{/asistencias/sesion/guardar}" method="post">
                        <div class="mb-2">
                            <label class="form-label">Horario y Categoría</label>
                            <select name="horarioId" class="form-select" required>
                                <option th:each="h : ${horarios}" th:value="${h.id}"
                                        th:text="${h.categoria.nombre + ' - ' + h.diaSemana + ' (' + h.horaInicio + ')'}"></option>
                            </select>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Instructor a Cargo</label>
                            <select name="instructorId" class="form-select" required>
                                <option th:each="ins : ${instructores}" th:value="${ins.id}"
                                        th:text="${ins.persona.nombres + ' ' + ins.persona.apellidos}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Fecha de la Clase</label>
                            <input type="date" name="fecha" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-dark w-100">Abrir Sesión de Clase</button>
                    </form>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-header bg-white fw-bold">Sesiones de Clase (Clic para pasar lista)</div>
                <div class="card-body p-0">
                    <div class="list-group list-group-flush">
                        <a th:each="ses : ${sesiones}"
                           th:href="@{/asistencias(sesionId=${ses.id})}"
                           class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
                           th:classappend="${sesionSeleccionada != null and sesionSeleccionada.id == ses.id ? 'active' : ''}">
                            <div>
                                <div class="fw-bold" th:text="${ses.fecha + ' - ' + ses.horario.categoria.nombre}"></div>
                                <small th:text="${ses.horario.diaSemana + ' (' + ses.horaInicio + ') - ' + ses.instructor.persona.nombres}"></small>
                            </div>
                            <span class="badge bg-light text-dark" th:text="${ses.estado}"></span>
                        </a>
                        <div th:if="${#lists.isEmpty(sesiones)}" class="p-3 text-center text-muted">
                            No hay sesiones programadas aún.
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Columna Derecha: Lista de Clase para Marcar Asistencia -->
        <div class="col-md-7">
            <div class="card shadow-sm" th:if="${sesionSeleccionada != null}">
                <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                    <span class="fw-bold"
                          th:text="${'2. Lista de Asistencia: ' + sesionSeleccionada.horario.categoria.nombre + ' (' + sesionSeleccionada.fecha + ')'}"></span>
                    <span class="badge bg-light text-dark" th:text="${sesionSeleccionada.horario.diaSemana}"></span>
                </div>
                <div class="card-body">
                    <form th:action="@{/asistencias/guardar-lista}" method="post">
                        <input type="hidden" name="sesionId" th:value="${sesionSeleccionada.id}">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>DNI</th>
                                    <th>Alumno Matriculado</th>
                                    <th>Grado</th>
                                    <th class="text-center">¿Asistió a clase?</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="mat : ${matriculados}">
                                    <td th:text="${mat.alumno.persona.dni}"></td>
                                    <td class="fw-semibold" th:text="${mat.alumno.persona.nombres + ' ' + mat.alumno.persona.apellidos}"></td>
                                    <td>
                                        <span th:if="${mat.alumno.cinturonActual != null}"
                                              class="cinturon-badge"
                                              th:classappend="${'cinturon-' + mat.alumno.cinturonActual.color}"
                                              th:text="${mat.alumno.cinturonActual.nombre}"></span>
                                    </td>
                                    <td class="text-center">
                                        <div class="form-check form-switch d-inline-block">
                                            <input class="form-check-input fs-5" type="checkbox"
                                                   name="presentesIds"
                                                   th:value="${mat.alumno.id}"
                                                   th:checked="${mapaAsistencia[mat.alumno.id] == 'ASISTIO' or mapaAsistencia[mat.alumno.id] == null}">
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(matriculados)}">
                                    <td colspan="4" class="text-center text-muted py-3">
                                        No hay alumnos matriculados en este horario.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                        <button th:if="${!#lists.isEmpty(matriculados)}" type="submit" class="btn btn-primary w-100 fw-bold">
                            Guardar Lista de Asistencia
                        </button>
                    </form>
                </div>
            </div>

            <div class="card shadow-sm border-0 bg-white p-5 text-center text-muted" th:if="${sesionSeleccionada == null}">
                <h5>👈 Selecciona o crea una sesión de clase a la izquierda para pasar lista</h5>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
