<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cambiar Contraseña')}"></head>
<body>
<div class="gajog-shell">
    <aside th:replace="~{fragments/layout :: sidebar('inicio')}"></aside>

    <div class="gajog-main">
        <header th:replace="~{fragments/layout :: topbar('Seguridad de Cuenta')}"></header>

        <main class="gajog-content" style="max-width: 560px;">
            <div th:replace="~{fragments/ui :: pageHeader('SEGURIDAD DE CUENTA', 'Actualizar contraseña', 'Por seguridad, tu contraseña debe tener mínimo 8 caracteres e incluir letras y números.')}"></div>

            <div th:if="${forzado}" class="alert alert-warning small fw-semibold mb-4">
                ⚠️ Estás ingresando con una contraseña inicial o temporal. Es obligatorio actualizarla antes de continuar usando el sistema.
            </div>

            <div class="card p-4">
                <form th:action="@{/cuenta/cambiar-password}" method="post">
                    <div class="mb-3">
                        <label for="passwordActual" class="form-label">Contraseña actual *</label>
                        <input id="passwordActual" type="password" name="passwordActual" class="form-control" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="passwordNueva" class="form-label">Nueva contraseña (mín. 8 caracteres, letras y números) *</label>
                        <input id="passwordNueva" type="password" name="passwordNueva" class="form-control" minlength="8" required>
                    </div>
                    <div class="mb-4">
                        <label for="confirmacionPassword" class="form-label">Confirmar nueva contraseña *</label>
                        <input id="confirmacionPassword" type="password" name="confirmacionPassword" class="form-control" minlength="8" required>
                    </div>
                    <button type="submit" class="btn btn-gajog-primary w-100 py-2">Guardar nueva contraseña &rarr;</button>
                </form>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
