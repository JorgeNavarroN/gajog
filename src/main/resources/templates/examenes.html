<!DOCTYPE html>
<html
    lang="es"
    xmlns:th="http://www.thymeleaf.org"
    th:replace="~{fragments/layout :: pagina(
      'Exámenes',
      'examenes',
      ~{::contenido}
      )}">
    <body>
        <section th:fragment="contenido">
            <link rel="stylesheet" th:href="@{/css/examenes.css}">
            <div class="encabezado-pagina">
                <div>
                    <div class="etiqueta">
                        ACADEMIA / ASCENSOS
                    </div>
                    <h1 class="titulo">
                        Exámenes de cinturón
                    </h1>
                    <p class="descripcion">
                        Selecciona un alumno para gestionar su pago, evaluación y resultado.
                    </p>
                </div>
            </div>
            <div class="caja-categoria" role="status" th:if="${exito != null}" th:text="${exito}">
            </div>
            <div class="errores-formulario" role="alert" th:if="${error != null}" th:text="${error}">
            </div>
            <section class="panel">
                <form th:action="@{/examenes}" method="get">
                    <div class="barra-filtros">
                        <div class="campo">
                            <label for="busqueda">
                                Alumno o DNI
                            </label>
                            <input
                                type="search"
                                id="busqueda"
                                name="busqueda"
                                th:value="${busqueda}"
                                placeholder="Buscar por nombre, apellido o DNI">
                        </div>
                        <div class="campo">
                            <label for="estado">
                                Estado del examen
                            </label>
                            <select id="estado" name="estado">
                                <option value="">
                                    Todos los estados
                                </option>
                                <option
                                    th:each="estado : ${estadosExamen}"
                                    th:value="${estado}"
                                    th:text="${estado}"
                                    th:selected="${estado == estadoSeleccionado}">
                                </option>
                            </select>
                        </div>
                    </div>
                    <div class="acciones-formulario">
                        <button class="boton boton-primario" type="submit">
                            Filtrar
                        </button>
                        <a class="boton" th:href="@{/examenes}">
                            Limpiar
                        </a>
                    </div>
                </form>
                <p class="descripcion" role="status" th:text="${filas.size() + (filas.size() == 1 ? ' alumno encontrado' : ' alumnos encontrados')}">
                </p>
                <div class="tabla-contenedor">
                    <table class="tabla">
                        <thead>
                            <tr>
                                <th>
                                    Alumno
                                </th>
                                <th>
                                    DNI
                                </th>
                                <th>
                                    Cinturón actual
                                </th>
                                <th>
                                    Estado del examen
                                </th>
                                <th>
                                    Acción
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="fila : ${filas}">
                                <td th:text="${fila.alumno.persona.apellidos + ', ' + fila.alumno.persona.nombres}">
                                </td>
                                <td th:text="${fila.alumno.persona.dni}">
                                </td>
                                <td>
                                    <span
                                        th:if="${fila.alumno.cinturonActual != null}"
                                        class="insignia-cinturon"
                                        th:text="${fila.alumno.cinturonActual.nombre}"
                                        th:style="|background:${@coloresCinturon.fondo(fila.alumno.cinturonActual.color)};color:${@coloresCinturon.texto(fila.alumno.cinturonActual.color)}|">
                                    </span>
                                    <span th:if="${fila.alumno.cinturonActual == null}">
                                        Sin registrar
                                    </span>
                                </td>
                                <td th:text="${fila.estado}">
                                </td>
                                <td>
                                    <a
                                        class="boton"
                                        th:href="@{/examenes(alumno=${fila.alumno.id})}"
                                        th:aria-label="${'Gestionar examen de ' + fila.alumno.persona.nombres}">
                                        Gestionar examen
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${filas.isEmpty()}">
                                <td colspan="5">
                                    No hay alumnos que coincidan con los filtros.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </section>
    </body>
</html>
