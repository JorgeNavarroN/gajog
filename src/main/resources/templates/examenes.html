<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Exámenes de Cinturón')}"></head>
<body class="bg-light">

<nav th:replace="~{fragments/layout :: navbar('examenes')}"></nav>

<div class="container">
    <div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="row g-4">
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-header bg-danger text-white fw-bold">Programar Examen de Ascenso</div>
                <div class="card-body">
                    <form th:action="@{/examenes/guardar}" method="post">
                        <div class="mb-2">
                            <label class="form-label">Alumno Postulante</label>
                            <select name="alumnoId" class="form-select" required>
                                <option th:each="a : ${alumnos}" th:value="${a.id}"
                                        th:text="${a.persona.nombres + ' ' + a.persona.apellidos + ' (Actual: ' + a.cinturonActual.nombre + ')'}"></option>
                            </select>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Cinturón Objetivo</label>
                            <select name="cinturonObjetivoId" class="form-select" required>
                                <option th:each="c : ${cinturones}" th:value="${c.id}" th:text="${c.nombre}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Fecha de Evaluación</label>
                            <input type="date" name="fechaExamen" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-danger w-100">Inscribir en Examen</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-white fw-bold">Exámenes Programados y Resultados</div>
                <div class="card-body table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Alumno</th>
                                <th>Grado Objetivo</th>
                                <th>Fecha</th>
                                <th>Puntaje</th>
                                <th>Resultado</th>
                                <th>Evaluación</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="ex : ${examenes}">
                                <td class="fw-semibold" th:text="${ex.alumno.persona.nombres + ' ' + ex.alumno.persona.apellidos}"></td>
                                <td>
                                    <span class="cinturon-badge"
                                          th:classappend="${'cinturon-' + ex.cinturonObjetivo.color}"
                                          th:text="${ex.cinturonObjetivo.nombre}"></span>
                                </td>
                                <td th:text="${ex.fechaExamen}"></td>
                                <td class="fw-bold" th:text="${ex.puntajeTotal != null ? ex.puntajeTotal + ' pts' : '-'}"></td>
                                <td>
                                    <span class="badge"
                                          th:classappend="${ex.resultado.name() == 'APROBADO' ? 'bg-success' : (ex.resultado.name() == 'REPROBADO' ? 'bg-danger' : 'bg-warning text-dark')}"
                                          th:text="${ex.resultado}"></span>
                                </td>
                                <td>
                                    <button th:if="${ex.resultado.name() == 'PENDIENTE'}"
                                            type="button"
                                            class="btn btn-sm btn-dark"
                                            data-bs-toggle="modal"
                                            data-bs-target="#modalCalificar"
                                            th:attr="data-id=${ex.id}, data-alumno=${ex.alumno.persona.nombres + ' ' + ex.alumno.persona.apellidos}, data-cinturon=${ex.cinturonObjetivo.nombre}"
                                            onclick="prepararModal(this)">
                                        📝 Calificar
                                    </button>
                                    <span th:if="${ex.resultado.name() != 'PENDIENTE'}" class="text-muted small">Cerrado</span>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(examenes)}">
                                <td colspan="6" class="text-center text-muted">No hay exámenes registrados.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal para Calificar los Criterios en una sola vista -->
<div class="modal fade" id="modalCalificar" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <form th:action="@{/examenes/evaluar-completo}" method="post">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title" id="tituloModalExamen">Evaluar Examen</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" name="examenId" id="modalExamenId">
                    <p class="text-muted mb-3">Ingresa el puntaje obtenido en cada criterio (mínimo aprobatorio total: <strong>70.00 pts</strong>):</p>

                    <div class="row g-3 align-items-center mb-3 border-bottom pb-2" th:each="crit : ${criterios}">
                        <input type="hidden" name="criterioIds" th:value="${crit.id}">
                        <div class="col-md-5">
                            <label class="fw-bold mb-0" th:text="${crit.nombre}"></label>
                            <div class="small text-muted" th:text="${'Máximo: ' + crit.puntajeMaximo + ' pts'}"></div>
                        </div>
                        <div class="col-md-3">
                            <input type="number" step="0.5" min="0" th:max="${crit.puntajeMaximo}"
                                   name="puntajes" class="form-control" placeholder="Puntaje" required>
                        </div>
                        <div class="col-md-4">
                            <input type="text" name="observaciones" class="form-control form-control-sm" placeholder="Observación (opcional)">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-success fw-bold">Guardar Notas y Evaluar Ascenso</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
<script>
    function prepararModal(boton) {
        document.getElementById('modalExamenId').value = boton.getAttribute('data-id');
        document.getElementById('tituloModalExamen').innerText =
            'Evaluando a: ' + boton.getAttribute('data-alumno') + ' → ' + boton.getAttribute('data-cinturon');
    }
</script>
</body>
</html>
