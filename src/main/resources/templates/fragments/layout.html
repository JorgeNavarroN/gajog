<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo + ' - GAJOG TKD'}">GAJOG TKD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Colores reales para los grados de cinturón */
        .cinturon-badge {
            font-weight: 700;
            padding: 0.38em 0.75em;
            border-radius: 6px;
            display: inline-block;
            font-size: 0.82rem;
            letter-spacing: 0.3px;
        }
        .cinturon-BLANCO   { background-color: #ffffff; color: #212529; border: 1.5px solid #adb5bd; }
        .cinturon-AMARILLO { background-color: #ffd43b; color: #212529; }
        .cinturon-VERDE    { background-color: #2b8a3e; color: #ffffff; }
        .cinturon-AZUL     { background-color: #1971c2; color: #ffffff; }
        .cinturon-ROJO     { background-color: #c92a2a; color: #ffffff; }
        .cinturon-NEGRO    { background-color: #141619; color: #fcc419; border: 1.5px solid #fcc419; }
    </style>
</head>
<body>

<nav th:fragment="navbar(activo)" class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">🥋 GAJOG TKD</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
            <div class="navbar-nav ms-auto">
                <a class="nav-link" th:classappend="${activo == 'inicio' ? 'active fw-bold' : ''}" th:href="@{/}">Inicio</a>
                <a class="nav-link" th:classappend="${activo == 'alumnos' ? 'active fw-bold' : ''}" th:href="@{/alumnos}">Alumnos</a>
                <a class="nav-link" th:classappend="${activo == 'personal' ? 'active fw-bold' : ''}" th:href="@{/personal}">Instructores y Apoderados</a>
                <a class="nav-link" th:classappend="${activo == 'matriculas' ? 'active fw-bold' : ''}" th:href="@{/matriculas}">Matrículas</a>
                <a class="nav-link" th:classappend="${activo == 'pagos' ? 'active fw-bold' : ''}" th:href="@{/pagos}">Pagos</a>
                <a class="nav-link" th:classappend="${activo == 'asistencias' ? 'active fw-bold' : ''}" th:href="@{/asistencias}">Asistencias</a>
                <a class="nav-link" th:classappend="${activo == 'examenes' ? 'active fw-bold' : ''}" th:href="@{/examenes}">Exámenes</a>
            </div>
        </div>
    </div>
</nav>

<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</div>

</body>
</html>
