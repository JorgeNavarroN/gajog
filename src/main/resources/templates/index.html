<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>GAJOG TKD - Panel Principal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">🥋 GAJOG TKD</a>
        <div class="navbar-nav">
            <a class="nav-link active" th:href="@{/}">Inicio</a>
            <a class="nav-link" th:href="@{/alumnos}">Alumnos</a>
            <a class="nav-link" th:href="@{/matriculas}">Matrículas</a>
            <a class="nav-link" th:href="@{/pagos}">Pagos</a>
            <a class="nav-link" th:href="@{/asistencias}">Asistencias</a>
            <a class="nav-link" th:href="@{/examenes}">Exámenes</a>
        </div>
    </div>
</nav>

<div class="container">
    <h2 class="mb-4">Panel de Control - Academia GAJOG TKD</h2>

    <div class="row g-4 mb-5">
        <div class="col-md-3">
            <div class="card text-bg-primary shadow-sm h-100">
                <div class="card-body">
                    <h6 class="card-title">Total de Alumnos</h6>
                    <h2 class="display-6 fw-bold" th:text="${totalAlumnos}">0</h2>
                    <a th:href="@{/alumnos}" class="text-white text-decoration-underline small">Ver alumnos →</a>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-bg-success shadow-sm h-100">
                <div class="card-body">
                    <h6 class="card-title">Matrículas Registradas</h6>
                    <h2 class="display-6 fw-bold" th:text="${totalMatriculas}">0</h2>
                    <a th:href="@{/matriculas}" class="text-white text-decoration-underline small">Gestionar matrículas →</a>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-bg-warning shadow-sm h-100">
                <div class="card-body">
                    <h6 class="card-title">Mensualidades Pendientes</h6>
                    <h2 class="display-6 fw-bold" th:text="${mensualidadesPendientes}">0</h2>
                    <a th:href="@{/pagos}" class="text-dark text-decoration-underline small">Cobrar mensualidades →</a>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-bg-info shadow-sm h-100">
                <div class="card-body">
                    <h6 class="card-title">Pagos Realizados</h6>
                    <h2 class="display-6 fw-bold" th:text="${totalPagos}">0</h2>
                    <a th:href="@{/pagos}" class="text-dark text-decoration-underline small">Ver historial →</a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
