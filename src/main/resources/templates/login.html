<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" data-theme="dark">
<head th:replace="~{fragments/layout :: head('Iniciar Sesión')}"></head>
<body class="d-flex align-items-center justify-content-center vh-100 p-3">
    <div class="card p-4 p-md-5" style="width: 100%; max-width: 430px;">
        <div class="text-center mb-4">
            <div class="gajog-brand-icon mx-auto mb-3" style="width: 56px; height: 56px; font-size: 1.75rem;">🥋</div>
            <div class="gajog-eyebrow">ACCESO INTERNO</div>
            <h1 class="h3 fw-bold mb-1">GAJOG <span class="text-danger">TKD</span></h1>
            <p class="small text-muted mb-0">Sistema de Gestión de Academias</p>
        </div>

        <div th:if="${param.locked}" class="alert alert-warning py-2 small fw-semibold text-center" role="alert">
            🔒 Cuenta bloqueada temporalmente por 15 minutos tras superar el límite de intentos fallidos.
        </div>
        <div th:if="${param.error}" class="alert alert-danger py-2 small fw-semibold text-center" role="alert">
            Credenciales inválidas. Verifica tu usuario y contraseña.
        </div>
        <div th:if="${param.logout}" class="alert alert-success py-2 small fw-semibold text-center" role="alert">
            Has cerrado sesión correctamente.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Usuario *</label>
                <input id="username" type="text" name="username" class="form-control" placeholder="Ej. admin, recepcion, instructor" required autofocus>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">Contraseña *</label>
                <input id="password" type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-gajog-primary w-100 py-2">Ingresar al sistema &rarr;</button>
        </form>
    </div>
</body>
</html>
