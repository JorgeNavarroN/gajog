<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión | GAJOG TKD</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: grid; place-items: center;
            background: #0c0f13; color: #f4f7fc;
            font-family: "Segoe UI", Arial, sans-serif; font-size: 14px;
        }
        .caja {
            width: min(380px, calc(100% - 32px)); padding: 32px 28px;
            background: #171e27; border: 1px solid #293343; border-radius: 14px;
        }
        .marca { display: flex; align-items: center; gap: 10px; margin-bottom: 26px; }
        .icono {
            display: grid; place-items: center; width: 38px; height: 38px;
            border-radius: 9px; background: #f10c28; font-weight: 900;
        }
        .nombre { font-size: 19px; font-weight: 800; }
        .nombre span { color: #f10c28; }
        h1 { margin: 0 0 6px; font-size: 22px; }
        p { margin: 0 0 22px; color: #91a2b9; font-size: 12px; }
        label { display: block; margin: 14px 0 7px; color: #c6d4e7; font-size: 12px; font-weight: 600; }
        input {
            width: 100%; min-height: 42px; padding: 10px 12px;
            border: 1px solid #354153; border-radius: 8px;
            background: #0e141c; color: #f4f7fc; font: inherit;
        }
        input:focus { outline: 2px solid #83baf9; outline-offset: 2px; border-color: #f10c28; }
        button {
            width: 100%; min-height: 42px; margin-top: 22px; border: 0; border-radius: 8px;
            background: #f10c28; color: white; font: inherit; font-weight: 700; cursor: pointer;
        }
        button:hover { background: #cf0922; }
        .aviso { margin-bottom: 14px; padding: 12px; border-radius: 8px; font-size: 12px; line-height: 1.5; }
        .error { border: 1px solid #813343; background: #351923; color: #ffabb9; }
        .ok { border: 1px solid #1f5b45; background: #123b2c; color: #8ff0c4; }
    </style>
</head>
<body>
<main class="caja">
    <div class="marca">
        <div class="icono">TK</div>
        <div class="nombre">GAJOG <span>TKD</span></div>
    </div>

    <h1>Iniciar sesión</h1>
    <p>Ingresa con tu usuario de la academia.</p>

    <!-- Mensaje genérico: no revela si el usuario existe (A07) -->
    <div class="aviso error" role="alert" th:if="${param.error}">
        Usuario o contraseña incorrectos. Después de 5 intentos fallidos la
        cuenta se bloquea 15 minutos.
    </div>
    <div class="aviso ok" role="status" th:if="${param.salida}">
        Cerraste sesión correctamente.
    </div>

    <form method="post" th:action="@{/login}">
        <label for="username">Usuario</label>
        <input id="username" name="username" type="text" maxlength="50"
               autocomplete="username" required autofocus>

        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" maxlength="100"
               autocomplete="current-password" required>

        <button type="submit">Entrar</button>
    </form>
</main>
</body>
</html>
