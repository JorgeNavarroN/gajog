<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Matrículas')}"></head>
<body class="bg-light">

<nav th:replace="~{fragments/layout :: navbar('matriculas')}"></nav>

<div class="container">
    <div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="row g-4">
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-header bg-success text-white fw-bold">Nueva Matrícula</div>
                <div class="card-body">
                    <form th:action="@{/matriculas/guardar}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Alumno Activo</label>
                            <select name="alumnoId" class="form-select" required>
                                <option value="">-- Seleccione Alumno --</option>
                                <option th:each="a : ${alumnos}"
                                        th:value="${a.id}"
                                        th:text="${a.persona.dni + ' - ' + a.persona.nombres + ' ' + a.persona.apellidos}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Categoría (Rango de Edad)</label>
                            <select name="categoriaId" id="selectCategoria" class="form-select" required>
                                <option value="">-- Seleccione Categoría --</option>
                                <option th:each="cat : ${categorias}"
                                        th:value="${cat.id}"
                                        th:text="${cat.nombre + ' (' + cat.edadMinima + ' a ' + cat.edadMaxima + ' años)'}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Horario Disponible</label>
                            <select name="horarioId" id="selectHorario" class="form-select" required>
                                <option value="">-- Primero elija una categoría --</option>
                                <option th:each="h : ${horarios}"
                                        th:value="${h.id}"
                                        th:attr="data-categoria=${h.categoria.id}"
                                        th:text="${h.diaSemana + ' (' + h.horaInicio + ' a ' + h.horaFin + ')'}"></option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Registrar Matrícula</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-white fw-bold">Matrículas Vigentes</div>
                <div class="card-body table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Alumno</th>
                                <th>Categoría</th>
                                <th>Día y Hora</th>
                                <th>Fecha Matrícula</th>
                                <th>Estado</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="m : ${matriculas}">
                                <td class="fw-semibold" th:text="${m.alumno.persona.nombres + ' ' + m.alumno.persona.apellidos}"></td>
                                <td th:text="${m.categoria.nombre}"></td>
                                <td th:text="${m.horario.diaSemana + ' ' + m.horario.horaInicio + ' - ' + m.horario.horaFin}"></td>
                                <td th:text="${m.fechaMatricula}"></td>
                                <td><span class="badge bg-primary" th:text="${m.estado}"></span></td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(matriculas)}">
                                <td colspan="5" class="text-center text-muted">No hay matrículas registradas.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
<script>
    const selectCategoria = document.getElementById('selectCategoria');
    const selectHorario = document.getElementById('selectHorario');
    const opcionesHorario = Array.from(selectHorario.querySelectorAll('option[data-categoria]'));

    function filtrarHorarios() {
        const catId = selectCategoria.value;
        selectHorario.innerHTML = '<option value="">-- Seleccione Horario --</option>';
        opcionesHorario.forEach(op => {
            if (op.getAttribute('data-categoria') === catId) {
                selectHorario.appendChild(op);
            }
        });
    }

    selectCategoria.addEventListener('change', filtrarHorarios);
    filtrarHorarios();
</script>
</body>
</html>
