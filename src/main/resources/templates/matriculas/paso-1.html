<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: pagina(
      'Registrar alumno',
      'nueva-matricula',
      ~{::contenido}
      )}">

    <body>

        <section th:fragment="contenido" class="registro">

            <div class="etiqueta">NUEVA MATRÍCULA / PASO 1 DE 3</div>

            <h1 class="titulo">Registrar alumno</h1>

            <p class="descripcion">
                Registra los datos y revisa la categoría asignada.
            </p>

            <div class="pasos">
                <span class="actual" aria-current="step">1. Datos</span>
                <span>2. Horario</span>
                <span>3. Pago</span>
            </div>

            <form class="panel"
                  method="post"
                  th:action="@{/matriculas/nueva/paso-1}"
                  th:object="${registroMatricula}">

                <div class="errores-formulario"
                     role="alert"
                     th:if="${#fields.hasAnyErrors()}">

                    <div th:each="error : ${#fields.allErrors()}"
                         th:text="${error}">
                    </div>

                </div>

                <h2>Datos del alumno</h2>

                <div class="grilla-dos">

                    <div class="campo">
                        <label for="nombres">Nombres *</label>
                        <input th:field="*{nombres}"
                               maxlength="100"
                               autocomplete="given-name"
                               required>
                    </div>

                    <div class="campo">
                        <label for="apellidos">Apellidos *</label>
                        <input th:field="*{apellidos}"
                               maxlength="100"
                               autocomplete="family-name"
                               required>
                    </div>

                    <div class="campo">
                        <label for="dni">DNI del alumno *</label>
                        <input th:field="*{dni}"
                               inputmode="numeric"
                               pattern="[0-9]{8}"
                               maxlength="8"
                               title="Ingresa 8 dígitos"
                               required>
                    </div>

                    <div class="campo">
                        <label for="fechaNacimiento">
                            Fecha de nacimiento *
                        </label>

                        <input type="date"
                               th:field="*{fechaNacimiento}"
                               th:max="${fechaActual}"
                               required>
                    </div>

                    <div class="campo">
                        <label for="telefono">Teléfono de contacto *</label>
                        <input type="tel"
                               th:field="*{telefono}"
                               inputmode="numeric"
                               pattern="[0-9]{9}"
                               maxlength="9"
                               required>
                    </div>

                    <div class="campo">
                        <label for="correo">Correo electrónico</label>
                        <input type="email"
                               th:field="*{correo}"
                               maxlength="150">
                    </div>

                </div>

                <div class="caja-categoria"
                     id="categoria-vista"
                     role="status">
                    Ingresa la fecha de nacimiento para calcular la categoría.
                </div>

                <!-- Rangos leídos de MySQL para la vista previa. -->
                <div id="categorias-configuracion" hidden>

                    <span th:each="categoria : ${categorias}"
                          th:attr="data-min=${categoria.edadMinima},
                          data-max=${categoria.edadMaxima},
                          data-nombre=${categoria.nombre}">
                    </span>

                </div>

                <hr class="separador">

                <details id="bloque-apoderado" class="apoderado-desplegable">

                    <summary>
                        <span>Datos del apoderado</span>
                        <span id="estado-apoderado">Opcional</span>
                    </summary>

                    <div class="apoderado-contenido">

                        <p class="descripcion" id="ayuda-apoderado">
                            Completa estos datos cuando corresponda.
                        </p>

                        <div class="grilla-dos" style="margin-top: 20px;">

                            <div class="campo">
                                <label for="apoderadoNombre">Nombres *</label>

                                <input th:field="*{apoderadoNombre}"
                                       maxlength="100">
                            </div>

                            <div class="campo">
                                <label for="apoderadoApellidos">Apellidos *</label>

                                <input th:field="*{apoderadoApellidos}"
                                       maxlength="100">
                            </div>

                            <div class="campo">
                                <label for="apoderadoDni">DNI del apoderado *</label>

                                <input th:field="*{apoderadoDni}"
                                       inputmode="numeric"
                                       pattern="[0-9]{8}"
                                       maxlength="8">
                            </div>

                            <div class="campo">
                                <label for="parentesco">Parentesco *</label>

                                <select th:field="*{parentesco}">

                                    <option value="">Seleccionar</option>

                                    <option th:each="parentesco : ${parentescos}"
                                            th:value="${parentesco.name()}"
                                            th:text="${parentesco.name()}">
                                    </option>

                                </select>
                            </div>

                        </div>

                    </div>

                </details>

                <div class="acciones-formulario">

                    <a th:href="@{/matriculas}" class="boton">
                        Cancelar
                    </a>

                    <button type="submit"
                            class="boton boton-primario">
                        Guardar y continuar →
                    </button>

                </div>

            </form>

            <script>
                (() => {
                const nacimiento =
                document.getElementById("fechaNacimiento");

                const vista =
                document.getElementById("categoria-vista");

                const bloque =
                document.getElementById("bloque-apoderado");

                const configuracion = [
                ...document.querySelectorAll(
                "#categorias-configuracion span"
                )
                ];

                const camposApoderado = [
                document.getElementById("apoderadoNombre"),
                document.getElementById("apoderadoApellidos"),
                document.getElementById("apoderadoDni"),
                document.getElementById("parentesco")
                ].filter(campo => campo !== null);

                function actualizarFormulario() {
                let edad = null;

                if (
                nacimiento.value &&
                nacimiento.value <= nacimiento.max
                ) {
                const [anio, mes, dia] =
                nacimiento.value.split("-").map(Number);

                const [anioActual, mesActual, diaActual] =
                nacimiento.max.split("-").map(Number);

                edad = anioActual - anio;

                if (
                mesActual < mes ||
                (mesActual === mes && diaActual < dia)
                ) {
                edad--;
                }
                }

                const coincidencias = edad === null
                ? []
                : configuracion.filter(categoria =>
                edad >= Number(categoria.dataset.min) &&
                edad <= Number(categoria.dataset.max)
                );

                if (!nacimiento.value) {
                vista.textContent =
                "Ingresa la fecha de nacimiento para calcular la categoría.";

                } else if (edad === null) {
                vista.textContent =
                "La fecha de nacimiento no puede ser futura.";

                } else if (coincidencias.length === 1) {
                vista.textContent =
                `Categoría: ${coincidencias[0].dataset.nombre} · ${edad} años`;

                } else if (coincidencias.length === 0) {
                vista.textContent =
                "No hay una categoría activa para esta edad.";

                } else {
                vista.textContent =
                "Hay rangos superpuestos. Revisa las categorías.";
                }

                const esMenor =
                edad !== null && edad < 18;

                const tieneDatosApoderado =
                camposApoderado.some(campo =>
                campo.value.trim() !== ""
                );

                bloque.open = esMenor || tieneDatosApoderado;

                camposApoderado.forEach(campo => {
                campo.required =
                esMenor || tieneDatosApoderado;
                });

                document.getElementById("estado-apoderado")
                .textContent = esMenor
                ? "Obligatorio · Menor de 18 años"
                : "Opcional";

                document.getElementById("ayuda-apoderado")
                .textContent = esMenor
                ? "El alumno es menor de edad. Completa los datos de su apoderado."
                : "Puedes agregar un apoderado. Si lo haces, completa todos sus datos.";
                }

                nacimiento.addEventListener(
                "input",
                actualizarFormulario
                );

                camposApoderado.forEach(campo => {
                campo.addEventListener(
                "input",
                actualizarFormulario
                );

                // Abre el bloque si hay un campo inválido.
                campo.addEventListener("invalid", () => {
                bloque.open = true;
                });
                });

                actualizarFormulario();
                })();
            </script>

        </section>

    </body>
</html>
