<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Instructores y Apoderados - GAJOG TKD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">🥋 GAJOG TKD</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/}">Inicio</a>
            <a class="nav-link" th:href="@{/alumnos}">Alumnos</a>
            <a class="nav-link active" th:href="@{/personal}">Instructores y Apoderados</a>
            <a class="nav-link" th:href="@{/matriculas}">Matrículas</a>
            <a class="nav-link" th:href="@{/pagos}">Pagos</a>
            <a class="nav-link" th:href="@{/asistencias}">Asistencias</a>
            <a class="nav-link" th:href="@{/examenes}">Exámenes</a>
        </div>
    </div>
</nav>

<div class="container">
    <div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="row g-4">
        <!-- SECCIÓN INSTRUCTORES -->
        <div class="col-md-6">
            <div class="card shadow-sm mb-3">
                <div class="card-header bg-dark text-white fw-bold">Registrar Instructor</div>
                <div class="card-body">
                    <form th:action="@{/personal/instructor/guardar}" method="post" class="row g-2">
                        <div class="col-md-4">
                            <input type="text" name="dni" class="form-control" placeholder="DNI" maxlength="15" required>
                        </div>
                        <div class="col-md-4">
                            <input type="text" name="nombres" class="form-control" placeholder="Nombres" required>
                        </div>
                        <div class="col-md-4">
                            <input type="text" name="apellidos" class="form-control" placeholder="Apellidos" required>
                        </div>
                        <div class="col-md-6">
                            <input type="text" name="telefono" class="form-control" placeholder="Teléfono">
                        </div>
                        <div class="col-md-6">
                            <input type="email" name="correo" class="form-control" placeholder="Correo">
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-dark w-100">Guardar Instructor</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-header bg-white fw-bold">Lista de Instructores</div>
                <div class="card-body table-responsive">
                    <table class="table table-sm table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>DNI</th>
                                <th>Nombre Completo</th>
                                <th>Teléfono</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="i : ${instructores}">
                                <td th:text="${i.persona.dni}"></td>
                                <td th:text="${i.persona.nombres + ' ' + i.persona.apellidos}"></td>
                                <td th:text="${i.persona.telefono}"></td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(instructores)}">
                                <td colspan="3" class="text-center text-muted">No hay instructores registrados.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- SECCIÓN APODERADOS -->
        <div class="col-md-6">
            <div class="card shadow-sm mb-3">
                <div class="card-header bg-secondary text-white fw-bold">Registrar Apoderado</div>
                <div class="card-body">
                    <form th:action="@{/personal/apoderado/guardar}" method="post" class="row g-2">
                        <div class="col-md-4">
                            <input type="text" name="dni" class="form-control" placeholder="DNI" maxlength="15" required>
                        </div>
                        <div class="col-md-4">
                            <input type="text" name="nombres" class="form-control" placeholder="Nombres" required>
                        </div>
                        <div class="col-md-4">
                            <input type="text" name="apellidos" class="form-control" placeholder="Apellidos" required>
                        </div>
                        <div class="col-md-6">
                            <input type="text" name="telefono" class="form-control" placeholder="Teléfono">
                        </div>
                        <div class="col-md-6">
                            <input type="email" name="correo" class="form-control" placeholder="Correo">
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-secondary w-100">Guardar Apoderado</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-header bg-white fw-bold">Lista de Apoderados</div>
                <div class="card-body table-responsive">
                    <table class="table table-sm table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>DNI</th>
                                <th>Nombre Completo</th>
                                <th>Teléfono</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="ap : ${apoderados}">
                                <td th:text="${ap.persona.dni}"></td>
                                <td th:text="${ap.persona.nombres + ' ' + ap.persona.apellidos}"></td>
                                <td th:text="${ap.persona.telefono}"></td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(apoderados)}">
                                <td colspan="3" class="text-center text-muted">No hay apoderados registrados.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
