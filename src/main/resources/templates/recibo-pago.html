<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${'Recibo de Pago #' + pago.id + ' - GAJOG TKD'}">Recibo de Pago</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @media print {
            .no-print { display: none !important; }
            body { background: #fff !important; }
            .recibo-box { border: none !important; box-shadow: none !important; }
        }
        .recibo-box {
            max-width: 650px;
            margin: 2rem auto;
            border: 2px solid #212529;
            border-radius: 8px;
            background: #fff;
            padding: 2rem;
        }
    </style>
</head>
<body class="bg-light">

<div class="container">
    <div class="text-center mt-4 no-print">
        <button onclick="window.print()" class="btn btn-dark fw-bold me-2">🖨️ Imprimir / Guardar en PDF</button>
        <a th:href="@{/pagos}" class="btn btn-outline-secondary">Volver a Pagos</a>
    </div>

    <div class="recibo-box shadow-sm">
        <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-3">
            <div>
                <h3 class="fw-bold mb-0">🥋 ACADEMIA GAJOG TKD</h3>
                <small class="text-muted">Comprobante Interno de Tesorería</small>
            </div>
            <div class="text-end">
                <h4 class="fw-bold text-danger mb-0" th:text="${'RECIBO N° ' + #numbers.formatInteger(pago.id, 5)}"></h4>
                <span class="badge"
                      th:classappend="${pago.estado.name() == 'REGISTRADO' ? 'bg-success' : 'bg-danger'}"
                      th:text="${pago.estado}"></span>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-sm-6">
                <p class="mb-1"><strong>Alumno:</strong> <span th:text="${pago.alumno.persona.nombres + ' ' + pago.alumno.persona.apellidos}"></span></p>
                <p class="mb-1"><strong>DNI:</strong> <span th:text="${pago.alumno.persona.dni}"></span></p>
            </div>
            <div class="col-sm-6 text-sm-end">
                <p class="mb-1"><strong>Fecha y Hora:</strong> <span th:text="${#temporals.format(pago.fechaPago, 'dd/MM/yyyy HH:mm')}"></span></p>
                <p class="mb-1"><strong>Medio de Pago:</strong> <span th:text="${pago.medioPago}"></span></p>
            </div>
        </div>

        <table class="table table-bordered align-middle mb-4">
            <thead class="table-dark">
                <tr>
                    <th>Concepto</th>
                    <th>Detalle / Periodo</th>
                    <th class="text-end">Importe</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="fw-semibold" th:text="${pago.tipoPago}"></td>
                    <td>
                        <span th:if="${pago.mensualidad != null}"
                              th:text="${'Cuota mensual correspondiente al periodo ' + pago.mensualidad.mes + '/' + pago.mensualidad.anio}"></span>
                        <span th:if="${pago.mensualidad == null}">Pago general de academia</span>
                    </td>
                    <td class="text-end fw-bold fs-5" th:text="${'S/ ' + pago.monto}"></td>
                </tr>
            </tbody>
        </table>

        <div class="d-flex justify-content-between align-items-center pt-3 border-top text-muted small">
            <span>Gracias por formar parte de la familia GAJOG TKD.</span>
            <span>Firma / Sello Administración</span>
        </div>
    </div>
</div>

</body>
</html>
